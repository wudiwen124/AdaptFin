[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advisor"
version = "0.1.0"
description = "基于 LangGraph 的 A 股多 Agent 投资研究助手"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-sqlite>=2.0.0",
]

[project.optional-dependencies]
data = [
  "akshare>=1.14",
  "baostock>=0.8.9",
  "tushare>=1.4.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
server = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
ui = [
  "streamlit>=1.36",
]

[tool.hatch.build.targets.wheel]
packages = ["src/advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
